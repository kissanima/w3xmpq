name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: .exe
            cli: w3xmpq.exe
            gui: w3xmpq-gui.exe
          - os: ubuntu-latest
            ext: ''
            cli: w3xmpq-linux
            gui: w3xmpq-gui-linux
          - os: macos-latest
            ext: ''
            cli: w3xmpq-macos
            gui: w3xmpq-gui-macos
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -e .
          pip install pyinstaller PySide6
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build CLI binary
        run: pyinstaller --onefile --name w3xmpq --paths src src/w3xmpq/_launch.py
      - name: Build GUI binary
        run: pyinstaller --onefile --name w3xmpq-gui --paths src src/w3xmpq/_launch_gui.py
      - name: Smoke test binaries
        shell: bash
        run: |
          ./dist/w3xmpq${{ matrix.ext }} --version
          ./dist/w3xmpq${{ matrix.ext }} --help > /dev/null
          ./dist/w3xmpq-gui${{ matrix.ext }} --version
      - name: Rename artifacts
        shell: bash
        run: |
          # Windows build is already named w3xmpq.exe — skip same-file mv
          [ "dist/w3xmpq${{ matrix.ext }}" = "dist/${{ matrix.cli }}" ] || \
            mv dist/w3xmpq${{ matrix.ext }} dist/${{ matrix.cli }}
          [ "dist/w3xmpq-gui${{ matrix.ext }}" = "dist/${{ matrix.gui }}" ] || \
            mv dist/w3xmpq-gui${{ matrix.ext }} dist/${{ matrix.gui }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli }}
          path: dist/${{ matrix.cli }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui }}
          path: dist/${{ matrix.gui }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Standalone binaries — no Python installation needed.

            **GUI** (v1.0+): `w3xmpq-gui.exe` — Windows · `w3xmpq-gui-linux` · `w3xmpq-gui-macos`

            **CLI**: `w3xmpq.exe` — Windows · `w3xmpq-linux` · `w3xmpq-macos`

            Usage (CLI): `w3xmpq extract map.w3x -o out/` (see README).
