[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "w3xmpq"
version = "1.3.0"
description = "Open any MPQ archive or Warcraft III map - recovers encrypted files via a known-plaintext attack, no listfile needed. Pure Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "w3xmpq contributors" }]
keywords = ["mpq", "warcraft3", "wc3", "dota", "extractor", "jass",
            "game-preservation", "reverse-engineering"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Archiving",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
# Converting a JPEG-flavoured Warcraft III texture to PNG needs a JPEG
# decoder; the GUI does not (Qt handles it), the CLI does.
images = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/kissanima/w3xmpq"
Repository = "https://github.com/kissanima/w3xmpq"
Issues = "https://github.com/kissanima/w3xmpq/issues"

[project.scripts]
w3xmpq = "w3xmpq.cli:main"
w3xmpq-gui = "w3xmpq.gui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]
